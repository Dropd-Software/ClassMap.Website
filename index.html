<!doctype html>
<!-- lang matches LanguageProvider's default ('el'), which is what the
     prerendered markup in dist/ actually contains. The in-page switcher
     changes copy client-side only, so there is no per-language URL to
     advertise with hreflang. -->
<html lang="el">
  <head>
    <!-- Set the theme attribute before first paint (and before React mounts)
         so dark-mode visitors never see a light-mode flash. Kept in sync
         with ThemeContext.jsx's getInitialTheme(). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <!-- Google Search picks one favicon per site and needs it declared here,
         not just present at /favicon.ico. It resizes down from the largest
         suitable file, and recommends squares in multiples of 48px — hence
         the real multi-size .ico (48/32/16) listed first. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="icon" type="image/png" href="/icon-48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Placeholder: scripts/prerender.js replaces this whole line with the
         per-route title, description, canonical and social tags from
         src/seo.js. Keep the exact markup — the script asserts on it. -->
    <title>Skedio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
